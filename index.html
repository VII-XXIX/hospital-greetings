<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sooriya Hospital Greetings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&family=Great+Vibes&family=Playfair+Display:wght@700&display=swap');
      
      :root {
        --bg-primary: #FFF7F2;
        --text-primary: #2B2B2B;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        overflow-y: auto;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Poppins', sans-serif;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #FFD6C9; 
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FF8A65; 
      }

      /* Animations from Spec */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes wiggle {
        0%, 100% { transform: rotate(-6deg); }
        50% { transform: rotate(6deg); }
      }

      .animate-fade-in-up {
        animation: fadeInUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }
      
      .group:hover .animate-wiggle {
        animation: wiggle 0.6s ease-in-out infinite;
      }

      .stagger-1 { animation-delay: 80ms; }
      .stagger-2 { animation-delay: 160ms; }
      .stagger-3 { animation-delay: 240ms; }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: '#FFF7F2',
              surface: '#FFFFFF',
              primary: '#FF8A65', // Salmon/Coral
              primarySoft: '#FFD6C9',
              textMain: '#2B2B2B',
              textSec: '#6B6B6B',
              borderSoft: 'rgba(0,0,0,0.06)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Poppins', 'sans-serif'],
              handwriting: ['Great Vibes', 'cursive'],
              serif: ['Playfair Display', 'serif'],
            },
            borderRadius: {
              'xl': '12px',
              '2xl': '16px',
              '3xl': '24px',
              'pill': '9999px',
            },
            boxShadow: {
              'card': '0 4px 24px -6px rgba(0,0,0,0.05)',
              'card-hover': '0 8px 32px -8px rgba(0,0,0,0.08)',
              'soft': '0 2px 10px rgba(0,0,0,0.03)',
            },
            transitionTimingFunction: {
              'bounce-soft': 'cubic-bezier(0.34, 1.56, 0.64, 1)',
            }
          }
        }
      }
    </script>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
